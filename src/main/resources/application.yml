spring:
  application:
    name: reservation-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USER:reservation}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: reservation-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      # fail fast instead of queueing forever behind a row lock
      connection-init-sql: "SET lock_timeout = '5s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: ADMIN
  metrics:
    tags:
      application: ${spring.application.name}

reservation:
  scheduling:
    enabled: ${RESERVATION_SCHEDULING_ENABLED:true}
  jwt:
    # REQUIRED: >= 32 bytes. Never commit a real secret; supply via env JWT_SECRET.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:}
  hold:
    default-ttl: ${HOLD_DEFAULT_TTL:PT10M}
    max-ttl: PT1H
  cancellation:
    cutoff-before-start: PT1H
  expiry:
    sweep-interval: PT15S
    batch-size: 100
  payment:
    reconcile-interval: PT30S
    reconcile-after: PT1M
    fake-mode: APPROVE
    fake-latency: PT0S
  idempotency:
    ttl: PT24H
    in-progress-timeout: PT2M
    cleanup-interval: PT1H
  outbox:
    poll-interval: PT2S
    batch-size: 100
  itinerary:
    max-items: 10
    # whole-transaction retries when PostgreSQL aborts an itinerary hold with a deadlock / lock timeout
    lock-retry-attempts: 3
  waitlist:
    default-ttl: PT24H
    max-ttl: P7D
    promote-interval: PT1S
    rescan-interval: PT1M
    expiry-interval: PT30S
    candidates-per-signal: 20
    signals-per-run: 100
  # Config-only resource types (no code needed): reuse an existing inventory model.
  custom-resource-types:
    - code: PARKING_SPOT
      inventory-model: TIME_RANGE
      hold-ttl: PT5M
      billing-period: PT1H

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level thread=%thread corr=%X{correlationId:-} logger=%logger{36} msg=\"%msg\"%n"
  level:
    com.reservation.engine: INFO
