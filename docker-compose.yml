# Local stack: Postgres + the engine. Dev-only credentials, override via .env for anything shared.
#   JWT_SECRET=$(openssl rand -base64 48) docker compose up -d --build
name: reservation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: ${POSTGRES_USER:-reservation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservation}
    ports:
      - "${PG_PORT:-55470}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservation} -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reservation
      DB_USER: ${POSTGRES_USER:-reservation}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-reservation}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes)}
      SPRING_PROFILES_ACTIVE: json
    ports:
      - "${APP_PORT:-7400}:8080"
    stop_grace_period: 30s

volumes:
  pgdata:
