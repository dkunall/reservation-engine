# Local PostgreSQL for running the engine (and its integration tests) without Testcontainers.
# Dev-only credentials; override via env for anything shared.
services:
  postgres:
    image: postgres:16-alpine
    container_name: reservation-postgres
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: ${POSTGRES_USER:-reservation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservation}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservation} -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
